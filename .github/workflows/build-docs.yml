name: Build Docs

on:
  workflow_call:
    inputs:
      deploy:
        description: 'Run the GitHub Pages steps (Setup Pages + upload artifact). Off for PR checks, which only build the docs.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - runs-on:
            - ubuntu-latest

    runs-on: ${{ matrix.build.runs-on }}

    env:
      SEARCH_API_BASE: https://csl860x2oj.execute-api.us-east-2.amazonaws.com/prod
      DOC_CATALOG_SOURCE_ID: docs-tenstorrent
      DOC_SITE_BASE_URL: https://docs.tenstorrent.com/tt-forge-onnx
      DOCS_ID_NAMESPACE: tt-forge-onnx
      DOCS_INDEX_VERSION: latest
      DOCS_OUTPUT_DIR: docs/build/html
      DOCS_SEARCH_INGEST_API_KEY: ${{ secrets.DOCS_SEARCH_INGEST_API_KEY_DOCS_TENSTORRENT }}

    steps:
    - uses: actions/checkout@v6
      with:
          fetch-depth: 0 # Fetch all history and tags
          clean: true

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "work-dir=$(pwd)" >> "$GITHUB_OUTPUT"

    - name: Git safe dir
      run: git config --global --add safe.directory ${{ steps.strings.outputs.work-dir }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Pages
      id: pages
      if: ${{ inputs.deploy }}
      uses: actions/configure-pages@v6

    - name: Build Docs
      shell: bash
      run: |
        bash docs/build_docs.sh

    - name: Warn if search ingest key is missing
      if: ${{ inputs.deploy && env.DOCS_SEARCH_INGEST_API_KEY == '' }}
      run: |
        echo "::warning::Skipping OpenSearch indexing: DOCS_SEARCH_INGEST_API_KEY_DOCS_TENSTORRENT secret not set."

    - name: Index docs into OpenSearch
      if: ${{ inputs.deploy && env.DOCS_SEARCH_INGEST_API_KEY != '' }}
      continue-on-error: true
      run: python3 scripts/index_remote_search.py

    - name: Upload artifact
      if: ${{ inputs.deploy }}
      uses: actions/upload-pages-artifact@57f0e8492b437b7818227931fef2faa1a379839b # v4 + upload-artifact@v7 update
      with:
        path: ./docs/build/html
