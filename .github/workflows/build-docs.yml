name: Build Docs

on:
  workflow_call:
    inputs:
      deploy:
        description: 'Run the GitHub Pages steps (Setup Pages + upload artifact). Off for PR checks, which only build the docs.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - runs-on:
            - ubuntu-latest

    runs-on: ${{ matrix.build.runs-on }}

    steps:
    - uses: actions/checkout@v6
      with:
          fetch-depth: 0 # Fetch all history and tags
          clean: true

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "work-dir=$(pwd)" >> "$GITHUB_OUTPUT"

    - name: Git safe dir
      run: git config --global --add safe.directory ${{ steps.strings.outputs.work-dir }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Pages
      id: pages
      if: ${{ inputs.deploy }}
      uses: actions/configure-pages@v6

    - name: Build Docs
      shell: bash
      run: |
        bash docs/build_docs.sh

    - name: Upload artifact
      if: ${{ inputs.deploy }}
      uses: actions/upload-pages-artifact@57f0e8492b437b7818227931fef2faa1a379839b # v4 + upload-artifact@v7 update
      with:
        path: ./docs/build/html
